# ============================================================================
# fabric-platform.yaml
#
# Input spec for generating a Microsoft Fabric `fab` CLI script that creates
# workspaces AND the items inside them. Review the plan before running the
# PowerShell provisioning entry point. Nothing touches Fabric until approval.
#
# Grounded in the architecture pattern spec:
#   §15.2  workspace naming   ws-{org}-{domain}-{component}-{env}
#   §15.4  item naming        [TYPE]_[PURPOSE]_[freetext]
#   §5     medallion layers   landing/raw/base/enriched/curated/semantic
#
# Templating: {domain} and {env} are expanded by the generator — one full set
# of workspaces+items per domain, per environment. Item lists are STARTERS:
# edit, add, or remove freely.
# ============================================================================

# --- Required ---------------------------------------------------------------

org: contoso                              # §15.1 lowercase, no spaces
capacity: fadev01    # §15.3 — must ALREADY exist (not created here)

environments:                             # §15.1 allows dev | tst | prd
  - dev
  - prd

domains:                                  # each gets its own full workspace set
  - fin

# --- Azure targets and identity --------------------------------------------
# These are references only. FabricFlow never stores client secrets here.
tenants:
  - name: primary
    tenant_id: YOUR_TENANT_ID
    subscription_id: YOUR_SUBSCRIPTION_ID
    enabled: false

workspace_permissions:
  enabled: false
  assignments:
    - workspace: ws-{org}-{domain}-engineering-{env}
      group_id: YOUR_ENTRA_GROUP_ID
      group_name: platform-engineers
      role: Member                    # Admin | Member | Contributor | Viewer

key_vault:
  enabled: false
  name: YOUR_KEY_VAULT_NAME
  subscription_id: YOUR_SUBSCRIPTION_ID
  secret_references:
    - name: source-connection
      secret_name: source-connection-string

monitoring:
  enabled: false
  workspace_id: YOUR_LOG_ANALYTICS_WORKSPACE_ID
  collect: [pipeline_runs, notebook_runs, refreshes, capacity_metrics]

deployment_history:
  enabled: true
  path: .fabricflow/deployment-history.json

# --- Source control and ALM --------------------------------------------------
# Replace the placeholder values before connecting workspaces to Azure DevOps.
# Never store a PAT, client secret, or certificate in this file.
git:
  enabled: false
  provider: azure_devops
  organization: YOUR_ADO_ORGANIZATION
  project: YOUR_ADO_PROJECT
  repository: YOUR_ADO_REPOSITORY
  branch: develop
  workspace_directories:
    engineering: fabric/engineering/{domain}/{env}
    store: fabric/store/{domain}/{env}
    analytics: fabric/analytics/{domain}/{env}

# Fabric supports one workspace per deployment-pipeline stage, so the Medium
# topology uses one dev-to-prd pipeline for each workspace type.
deployment_pipelines:
  enabled: false
  pipelines:
    - name: dp-{org}-{domain}-engineering
      dev_workspace: ws-{org}-{domain}-engineering-dev
      prd_workspace: ws-{org}-{domain}-engineering-prd
    - name: dp-{org}-{domain}-store
      dev_workspace: ws-{org}-{domain}-store-dev
      prd_workspace: ws-{org}-{domain}-store-prd
    - name: dp-{org}-{domain}-analytics
      dev_workspace: ws-{org}-{domain}-analytics-dev
      prd_workspace: ws-{org}-{domain}-analytics-prd


# --- Explicit workspace and item names --------------------------------------
# These are the names that will be created. Edit them directly; the runner
# does not invent or expand workspace/item names.
workspaces:
  - name: ws-contoso-fin-engineering-dev
    capacity: fadev01
    items:
      - name: vl_cnfgs_fin_env
        type: VariableLibrary
      - name: nb_trnsf_fin_raw_to_base
        type: Notebook
        definition: notebooks/NB_TRNSF_fin_raw_to_base.ipynb
      - name: nb_trnsf_fin_base_to_enriched
        type: Notebook
        definition: notebooks/NB_TRNSF_fin_base_to_enriched.ipynb
      - name: nb_cnfgs_fin_initialize_metadata
        type: Notebook
        definition: notebooks/NB_CNFGS_fin_initialize_metadata.ipynb
      - name: dp_orchs_fin_master
        type: DataPipeline

  - name: ws-contoso-fin-store-dev
    capacity: fadev01
    items:
      - name: lh_store_fin_landing
        type: Lakehouse
        enableSchemas: false
      - name: lh_store_fin_raw
        type: Lakehouse
        enableSchemas: true
      - name: lh_store_fin_base
        type: Lakehouse
        enableSchemas: true
      - name: lh_store_fin_enriched
        type: Lakehouse
        enableSchemas: true
      - name: lh_store_fin_curated
        type: Lakehouse
        enableSchemas: true
      - name: lh_store_fin_semantic
        type: Lakehouse
        enableSchemas: true
      - name: nb_ingst_fin_example_source
        type: Notebook
        ingestion_method: notebook
        definition: notebooks/NB_INGST_fin_example_source.ipynb
      - name: dp_ingst_fin_landing_loader
        type: DataPipeline
        ingestion_method: copy_activity
        definition: pipelines/DP_INGST_fin_landing_loader.json

  - name: ws-contoso-fin-analytics-dev
    capacity: fadev01
    items:
      - name: sm_anlyz_fin_financial
        type: SemanticModel
      - name: rp_anlyz_fin_overview
        type: Report

  - name: ws-contoso-fin-engineering-prd
    capacity: fadev01
    items:
      - name: vl_cnfgs_fin_env
        type: VariableLibrary
      - name: nb_trnsf_fin_raw_to_base
        type: Notebook
        definition: notebooks/NB_TRNSF_fin_raw_to_base.ipynb
      - name: nb_trnsf_fin_base_to_enriched
        type: Notebook
        definition: notebooks/NB_TRNSF_fin_base_to_enriched.ipynb
      - name: nb_cnfgs_fin_initialize_metadata
        type: Notebook
        definition: notebooks/NB_CNFGS_fin_initialize_metadata.ipynb
      - name: dp_orchs_fin_master
        type: DataPipeline

  - name: ws-contoso-fin-store-prd
    capacity: fadev01
    items:
      - name: lh_store_fin_landing
        type: Lakehouse
        enableSchemas: false
      - name: lh_store_fin_raw
        type: Lakehouse
        enableSchemas: true
      - name: lh_store_fin_base
        type: Lakehouse
        enableSchemas: true
      - name: lh_store_fin_enriched
        type: Lakehouse
        enableSchemas: true
      - name: lh_store_fin_curated
        type: Lakehouse
        enableSchemas: true
      - name: lh_store_fin_semantic
        type: Lakehouse
        enableSchemas: true
      - name: nb_ingst_fin_example_source
        type: Notebook
        ingestion_method: notebook
        definition: notebooks/NB_INGST_fin_example_source.ipynb
      - name: dp_ingst_fin_landing_loader
        type: DataPipeline
        ingestion_method: copy_activity
        definition: pipelines/DP_INGST_fin_landing_loader.json

  - name: ws-contoso-fin-analytics-prd
    capacity: fadev01
    items:
      - name: sm_anlyz_fin_financial
        type: SemanticModel
      - name: rp_anlyz_fin_overview
        type: Report

# --- Metadata-driven bronze/raw ingestion -----------------------------------
# Control tables describe source objects, so one notebook can ingest many
# sources without creating one notebook per source.
metadata_bronze:
  mode: prompt                         # prompt | notebook | copy_activity
  options:
    notebook_item: nb_ingst_fin_example_source
    copy_pipeline_item: dp_ingst_fin_landing_loader
  copy_activity:
    parameters:
      - SourceObject
      - TargetTable
      - LoadType
      - WatermarkColumn
    control_table: raw._sys_ingestion_config
    watermark_table: raw._sys_watermark
    pipeline_definition: pipelines/DP_INGST_fin_landing_loader.json
  control_lakehouse: lh_store_fin_raw
  source_registry_table: raw._sys_source_registry
  ingestion_config_table: raw._sys_ingestion_config
  watermark_table: raw._sys_watermark
  run_log_table: raw._sys_run_log
  sources:
    - source_name: example_source
      source_format: json
      source_path: Files/incoming/finance
      target_table: raw.source_data
      load_type: incremental
      watermark_column: updated_at
      enabled: true


# --- Platform-level workspace (§15.2 — no env suffix, not per-domain) --------
# Named ws-{org}-platform-monitoring. Delete if not needed.

platform_workspaces:
  monitoring:
    lakehouses:
      - LH_MONIT_platform_ops

# --- Data Classification & Policy ----------------------------------------
# Define classification labels and apply them to items. For documentation and
# governance. Classifications are metadata-only; they do NOT enforce access control.
#
# classification_label: a brief tag (e.g., PII, Public, Confidential, Financial)
# items: list of item names from workspaces above that carry this classification

classifications:
  PII:
    label: "Personally Identifiable Information"
    description: "Contains customer names, emails, addresses, SSNs, or similar"
    color: "#d32f2f"  # Red
    items:
      - lh_store_fin_raw
      - lh_store_fin_landing
      - nb_ingst_fin_example_source
  
  Confidential:
    label: "Confidential / Internal Only"
    description: "Restricted to finance team; contains sensitive metrics"
    color: "#f57c00"  # Orange
    items:
      - lh_store_fin_base
      - lh_store_fin_enriched
      - sm_anlyz_fin_financial
      - nb_trnsf_fin_raw_to_base
      - nb_trnsf_fin_base_to_enriched
  
  Public:
    label: "Public / Shareable"
    description: "Can be shared externally; no sensitive data"
    color: "#388e3c"  # Green
    items:
      - lh_store_fin_curated
      - rp_anlyz_fin_overview
